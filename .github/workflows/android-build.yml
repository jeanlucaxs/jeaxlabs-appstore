name: JeaxLabs OS CI
on:
  push:
    branches: [main]
    paths:
      - 'android-source/**'
      - 'android-source/version.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android-source/**'
      - 'android-source/version.properties'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Read central version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' android-source/version.properties)"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' android-source/version.properties)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download JeaxLabs logo
        shell: bash
        run: |
          mkdir -p android-source/app/src/main/res/drawable-nodpi
          curl --fail --location --silent --show-error --max-time 30 https://www.jeaxlabs.com.br/logo-full.png -o android-source/app/src/main/res/drawable-nodpi/jeaxlabs_logo.png || echo 'Logo download failed; continuing because the current shell does not require it.'
      - name: Compile CI APK
        working-directory: android-source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Package CI APK and source
        shell: bash
        run: |
          mkdir -p release-package
          cp "android-source/app/build/outputs/apk/debug/app-debug.apk" "release-package/JeaxLabsOS-v${VERSION_NAME}-debug-CI.apk"
          cp android-source/README.md release-package/README-build.md
          cp RELEASE_POLICY.md release-package/RELEASE_POLICY.md
          cp CHANGELOG.md release-package/CHANGELOG.md
          cd android-source
          zip -qr "../release-package/JeaxLabsOS-v${VERSION_NAME}-Source-CI.zip" . -x '*/build/*' '.gradle/*'
          cd ../release-package
          zip -qr "../JeaxLabsOS-v${VERSION_NAME}-CI-Build.zip" .
      - name: Upload CI artifact (not an official release)
        uses: actions/upload-artifact@v4
        with:
          name: JeaxLabsOS-v${{ steps.version.outputs.VERSION_NAME }}-CI
          path: JeaxLabsOS-v${{ steps.version.outputs.VERSION_NAME }}-CI-Build.zip
          if-no-files-found: error
          retention-days: 30
      - name: Delete legacy CI artifacts that included public Python tools
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_CUTOFF: "2026-10-23T21:58:19Z"
        run: |
          set -euo pipefail
          ARTIFACTS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100")"
          echo "$ARTIFACTS" | jq -r --arg cutoff "$LEGACY_CUTOFF" '
            .artifacts[]
            | select(.name | startswith("JeaxLabsOS-v"))
            | select(.name | endswith("-CI"))
            | select(.created_at < $cutoff)
            | .id
          ' | while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            echo "Deleting legacy CI artifact $artifact_id"
            curl --fail --silent --show-error -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
