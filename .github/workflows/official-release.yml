name: JeaxLabs OS Official Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
  actions: read
jobs:
  official-release:
    name: Validate, sign, and publish official version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' android-source/version.properties)"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' android-source/version.properties)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG_VERSION" = "$VERSION_NAME" || { echo "Tag and version.properties do not match."; exit 1; }
          test -n "$VERSION_CODE" && [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          test "$(jq -r '.release' catalog.json)" = "$VERSION_NAME" || { echo "catalog.json release does not match version.properties."; exit 1; }
          grep -Eq "^## \[$VERSION_NAME\]" CHANGELOG.md || { echo "CHANGELOG.md needs a section for $VERSION_NAME."; exit 1; }
          PREVIOUS_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -Fxv "$GITHUB_REF_NAME" | head -n 1 || true)"
          if [ -n "$PREVIOUS_TAG" ] && git show "$PREVIOUS_TAG:android-source/version.properties" >/tmp/previous-version.properties 2>/dev/null; then
            PREVIOUS_CODE="$(sed -n 's/^VERSION_CODE=//p' /tmp/previous-version.properties)"
            if [[ "$PREVIOUS_CODE" =~ ^[0-9]+$ ]] && [ "$VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
              echo "VERSION_CODE must be greater than the previous tagged version ($PREVIOUS_CODE)."
              exit 1
            fi
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Require permanent Android signing key and update token
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPDATES_REPO_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          JXU_PACKAGE_PASSWORD: ${{ secrets.JXU_PACKAGE_PASSWORD }}
          JXU_PUBLISHER_KEY_BASE64: ${{ secrets.JXU_PUBLISHER_KEY_BASE64 }}
          JXU_PUBLISHER_KEY_PASSWORD: ${{ secrets.JXU_PUBLISHER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD UPDATES_REPO_TOKEN JXU_PACKAGE_PASSWORD JXU_PUBLISHER_KEY_BASE64 JXU_PUBLISHER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jeaxlabs-release.keystore"
          test -s "$RUNNER_TEMP/jeaxlabs-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jeaxlabs-release.keystore" >> "$GITHUB_ENV"
          echo "$JXU_PUBLISHER_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/jeaxlabs-publisher.pem"
          test -s "$RUNNER_TEMP/jeaxlabs-publisher.pem"
          echo "JXU_PUBLISHER_KEY_PATH=$RUNNER_TEMP/jeaxlabs-publisher.pem" >> "$GITHUB_ENV"
          PREVIOUS_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -Fxv "$GITHUB_REF_NAME" | head -n 1 || true)"
          if [ -n "$PREVIOUS_TAG" ]; then MINIMUM_VERSION="${PREVIOUS_TAG#v}"; else MINIMUM_VERSION="1.4.0"; fi
          echo "MINIMUM_VERSION=$MINIMUM_VERSION" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Python for encrypted update package
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install update package crypto dependency
        run: python -m pip install --upgrade cryptography
      - name: Verify update repository token
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
        run: gh api repos/jeanlucaxs/jeaxlabs-os-updates --jq .full_name
      - name: Build release APK
        working-directory: android-source
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jeaxlabs-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signature and prepare official assets
        shell: bash
        env:
          JXU_PACKAGE_PASSWORD: ${{ secrets.JXU_PACKAGE_PASSWORD }}
          JXU_PUBLISHER_KEY_PASSWORD: ${{ secrets.JXU_PUBLISHER_KEY_PASSWORD }}
          JXU_PUBLISHER_KEY_PATH: ${{ runner.temp }}/jeaxlabs-publisher.pem
        run: |
          set -euo pipefail
          APK_SOURCE="android-source/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="JeaxLabsOS-v${VERSION_NAME}.apk"
          JXU_NAME="JeaxLabsOS-v${VERSION_NAME}.jxu"
          cp "$APK_SOURCE" "$APK_NAME"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK_SIGNER" && test -x "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose "$APK_NAME"
          mkdir -p release-package
          cp "$APK_NAME" release-package/"$APK_NAME"
          cp android-source/README.md release-package/README-build.md
          cp RELEASE_POLICY.md release-package/RELEASE_POLICY.md
          cp CHANGELOG.md release-package/CHANGELOG.md
          cd android-source
          zip -qr "../release-package/JeaxLabsOS-v${VERSION_NAME}-Source.zip" . -x '*/build/*' '.gradle/*'
          cd ..
          awk -v version="$VERSION_NAME" '$0 ~ "^## \\[" version "\\]" { active=1; print; next } /^## \\[/ { if (active) exit } active { print }' CHANGELOG.md > release-package/release-notes.md
          test -s release-package/release-notes.md
          cp release-package/release-notes.md "JeaxLabsOS-v${VERSION_NAME}-Release-Notes.md"
          cat > "$RUNNER_TEMP/create_jxu.py" <<'PY'
          import argparse, hashlib, json, os, re, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          KDF_ROUNDS = 600_000
          def canonical_json(value):
              return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          def sha256_bytes(value):
              return hashlib.sha256(value).hexdigest()
          def derive_key(password, salt):
              if len(password) < 8:
                  raise ValueError("A senha do pacote .jxu precisa ter pelo menos 8 caracteres.")
              return PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=KDF_ROUNDS).derive(password.encode("utf-8"))
          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--apk", required=True, type=Path)
              parser.add_argument("--output", required=True, type=Path)
              parser.add_argument("--version", required=True)
              parser.add_argument("--version-code", required=True, type=int)
              parser.add_argument("--minimum-version", required=True)
              parser.add_argument("--notes-file", required=True, type=Path)
              parser.add_argument("--package-password", required=True)
              parser.add_argument("--key-path", required=True, type=Path)
              parser.add_argument("--key-password", default="")
              a = parser.parse_args()
              if not a.apk.is_file() or a.apk.suffix.lower() != ".apk":
                  raise ValueError("O arquivo precisa ser um APK.")
              if not re.fullmatch(r"\d+\.\d+\.\d+", a.version) or not re.fullmatch(r"\d+\.\d+\.\d+", a.minimum_version):
                  raise ValueError("Versões precisam estar no formato X.Y.Z.")
              if a.version_code < 1:
                  raise ValueError("versionCode inválido.")
              with zipfile.ZipFile(a.apk) as z:
                  if "AndroidManifest.xml" not in z.namelist():
                      raise ValueError("O APK não contém AndroidManifest.xml.")
              private = serialization.load_pem_private_key(a.key_path.read_bytes(), password=a.key_password.encode() if a.key_password else None)
              if not isinstance(private, Ed25519PrivateKey):
                  raise ValueError("A chave de assinatura deve ser Ed25519.")
              public_pem = private.public_key().public_bytes(encoding=serialization.Encoding.PEM, format=serialization.PublicFormat.SubjectPublicKeyInfo)
              public_der = private.public_key().public_bytes(encoding=serialization.Encoding.DER, format=serialization.PublicFormat.SubjectPublicKeyInfo)
              fingerprint = sha256_bytes(public_der)
              salt, nonce = os.urandom(16), os.urandom(12)
              aad = f"JeaxLabs-JXU-v1|{a.version}|{a.minimum_version}".encode("utf-8")
              encrypted = AESGCM(derive_key(a.package_password, salt)).encrypt(nonce, a.apk.read_bytes(), aad)
              manifest = {
                  "format": "JXU", "format_version": 1, "product": "JeaxLabs OS",
                  "package_type": "system-update", "target_package": "br.com.jeaxlabs.os",
                  "version": a.version, "version_code": a.version_code,
                  "minimum_version": a.minimum_version, "release_notes": a.notes_file.read_text(encoding="utf-8").strip(),
                  "source_filename": a.apk.name, "payload_filename": "payload.aesgcm",
                  "encryption": "AES-256-GCM", "kdf": "PBKDF2-HMAC-SHA256", "kdf_iterations": KDF_ROUNDS,
                  "salt_hex": salt.hex(), "nonce_hex": nonce.hex(), "aad_utf8": aad.decode("utf-8"),
                  "payload_sha256": sha256_bytes(encrypted), "payload_size": len(encrypted),
                  "signature": "Ed25519", "publisher_fingerprint_sha256": fingerprint,
                  "created_utc": datetime.now(timezone.utc).isoformat(),
              }
              manifest_bytes = canonical_json(manifest)
              signature = private.sign(manifest_bytes)
              a.output.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(a.output, "w", compression=zipfile.ZIP_DEFLATED) as z:
                  z.writestr("manifest.json", manifest_bytes)
                  z.writestr("payload.aesgcm", encrypted, compress_type=zipfile.ZIP_STORED)
                  z.writestr("signature.ed25519", signature)
                  z.writestr("publisher.pub.pem", public_pem)
              private.public_key().verify(signature, manifest_bytes)
          if __name__ == "__main__":
              main()
          PY
          python "$RUNNER_TEMP/create_jxu.py" \
            --apk "$APK_NAME" \
            --output "$JXU_NAME" \
            --version "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --minimum-version "$MINIMUM_VERSION" \
            --notes-file "JeaxLabsOS-v${VERSION_NAME}-Release-Notes.md" \
            --package-password "$JXU_PACKAGE_PASSWORD" \
            --key-path "$JXU_PUBLISHER_KEY_PATH" \
            --key-password "$JXU_PUBLISHER_KEY_PASSWORD"
          cp "$JXU_NAME" release-package/
          (cd release-package && sha256sum "JeaxLabsOS-v${VERSION_NAME}.apk" "JeaxLabsOS-v${VERSION_NAME}.jxu" > "JeaxLabsOS-v${VERSION_NAME}-SHA256SUMS.txt")
          cp release-package/"JeaxLabsOS-v${VERSION_NAME}-SHA256SUMS.txt" .
          (cd release-package && zip -qr "../JeaxLabsOS-v${VERSION_NAME}-Official-Build.zip" .)
          echo "APK_SHA256=$(sha256sum "$APK_NAME" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c '%s' "$APK_NAME")" >> "$GITHUB_ENV"
          echo "JXU_SHA256=$(sha256sum "$JXU_NAME" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "JXU_SIZE_BYTES=$(stat -c '%s' "$JXU_NAME")" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: JeaxLabs OS ${{ github.ref_name }} — versão oficial
          body_path: JeaxLabsOS-${{ github.ref_name }}-Release-Notes.md
          files: |
            JeaxLabsOS-${{ github.ref_name }}.apk
            JeaxLabsOS-${{ github.ref_name }}.jxu
            JeaxLabsOS-${{ github.ref_name }}-Official-Build.zip
            JeaxLabsOS-${{ github.ref_name }}-Source.zip
            JeaxLabsOS-${{ github.ref_name }}-SHA256SUMS.txt
          fail_on_unmatched_files: true
      - name: Synchronize the official update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$VERSION_NAME" \
            --arg version_code "$VERSION_CODE" \
            --arg download_url "https://github.com/jeanlucaxs/jeaxlabs-appstore/releases/download/v${VERSION_NAME}/JeaxLabsOS-v${VERSION_NAME}.jxu" \
            --arg sha256 "$JXU_SHA256" \
            --arg size "$JXU_SIZE_BYTES" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg release_notes "$(cat "JeaxLabsOS-v${VERSION_NAME}-Release-Notes.md")" \
            '{event_type:"jeaxlabs_os_official_release",client_payload:{version:$version,version_code:$version_code,download_url:$download_url,package_type:"system-update",sha256:$sha256,size_bytes:$size,published_at:$published_at,release_notes:$release_notes}}' > event.json
          gh api repos/jeanlucaxs/jeaxlabs-os-updates/dispatches --method POST --input event.json
